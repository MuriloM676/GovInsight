services:
  db:
    image: postgres:16-alpine
    container_name: govinsight-db
    environment:
      POSTGRES_USER: govinsight
      POSTGRES_PASSWORD: govinsight
      POSTGRES_DB: govinsight
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govinsight -d govinsight"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govinsight-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://govinsight:govinsight@db:5432/govinsight?schema=public"
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: govinsight
      DB_PASSWORD: govinsight
      DB_NAME: govinsight
    volumes:
      - ./dados_siconfi_3550100:/app/dados_siconfi_3550100
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        npx prisma migrate deploy &&
        npm run etl &&
        npm start
      "

volumes:
  pgdata:
